<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BasemFly | حجوزات السفر</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172554}
header{background:#082f49;color:white;text-align:center;padding:30px 15px}
header h1{font-size:36px;margin:0}
header p{margin:10px 0 0}
main{max-width:700px;margin:25px auto;padding:15px}
.card{background:white;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 4px 15px #0001}
h2{margin-top:0;color:#0369a1}
label{display:block;margin:13px 0 6px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:18px;background:#0284c7;color:white;border:0;border-radius:9px;font-size:17px;cursor:pointer}
button:hover{background:#0369a1}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>
<body>
<header>
<h1>BasemFly ✈️</h1>
<p>رحلتك القادمة تبدأ من هنا</p>
</header>

<main>
<section class="card">
<h2>✈️ البحث عن الرحلات</h2>
<form id="flightForm">
<label for="from">مدينة المغادرة</label>
<input id="from" placeholder="مثال: Düsseldorf" required>

<label for="to">مدينة الوصول</label>
<input id="to" placeholder="مثال: Istanbul" required>

<label for="date">تاريخ المغادرة</label>
<input id="date" type="date" required>

<button type="submit">البحث عن الرحلات</button>
</form>
</section>

<section class="card">
<h2>🏨 البحث عن الفنادق</h2>
<form id="hotelForm">
<label for="city">المدينة</label>
<input id="city" placeholder="مثال: Istanbul" required>

<label for="checkin">تاريخ تسجيل الوصول</label>
<input id="checkin" type="date" required>

<label for="checkout">تاريخ تسجيل المغادرة</label>
<input id="checkout" type="date" required>

<button type="submit">البحث عن الفنادق</button>
</form>
</section>
</main>

<footer>© 2026 BasemFly — السفر أصبح أسهل</footer>

<script>
document.getElementById("flightForm").addEventListener("submit",function(e){
e.preventDefault();
const from=document.getElementById("from").value.trim();
const to=document.getElementById("to").value.trim();
const date=document.getElementById("date").value;
const q="Flights from "+from+" to "+to+" on "+date;
window.open("https://www.google.com/travel/flights?q="+encodeURIComponent(q),"_blank");
});

document.getElementById("hotelForm").addEventListener("submit",function(e){
e.preventDefault();
const city=document.getElementById("city").value.trim();
const checkin=document.getElementById("checkin").value;
const checkout=document.getElementById("checkout").value;
if(checkout<=checkin){
alert("يجب أن يكون تاريخ المغادرة بعد تاريخ الوصول.");
return;
}
const q="Hotels in "+city+" check in "+checkin+" check out "+checkout;
window.open("https://www.google.com/travel/hotels?q="+encodeURIComponent(q),"_blank");
});
</script>
</body>
</html>
